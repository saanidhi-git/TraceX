services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      GRAPHSENTINEL_DATA_DIR: /data
      GRAPHSENTINEL_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
      GRAPHSENTINEL_MAX_UPLOAD_BYTES: ${GRAPHSENTINEL_MAX_UPLOAD_BYTES:-10485760}
      GRAPHSENTINEL_MAX_TRANSACTIONS: ${GRAPHSENTINEL_MAX_TRANSACTIONS:-50000}
    volumes:
      - graphsentinel-data:/data
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  graphsentinel-data:
